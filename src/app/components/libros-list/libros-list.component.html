<h2>Catálogo de libros</h2>

<div class="search-bar">
  <input 
    type="text" 
    placeholder="Buscar por título o autor..." 
    [(ngModel)]="filtroTexto"
    (ngModelChange)="aplicarFiltro()"
    name="filtroBusqueda"
  >
</div>

<table>
  <thead>
    <tr>
      <th>Título</th>
      <th>Autor</th>
      <th>Género</th>
      <th>Publicación</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let libro of librosFiltrados" [class.selected]="selectedLibro?.id === libro.id">
      <td>{{ libro.titulo }}</td>
      <td>{{ libro.autor }}</td>
      <td>{{ libro.genero }}</td>
      
      <td [ngClass]="{'libro-antiguo': libro.publicacion < 2000, 'libro-reciente': libro.publicacion >= 2020}">
        {{ libro.publicacion }}
      </td>
      
      <td class="acciones">
        <button class="btn-editar" (click)="view(libro)">Editar</button>
        <button class="btn-eliminar" (click)="delete(libro.id)">Eliminar</button>
      </td>
    </tr>
  </tbody>

  <tfoot *ngIf="!selectedLibro">
    <tr>
      <td colspan="5"> 
        <h3 style="margin-top: 0;"> Agregar libro</h3>
        
        <form #addLibroForm="ngForm" (ngSubmit)="save()">
          <p>
            <label>Título:</label>
            <input type="text" [(ngModel)]="newLibro.titulo" name="add_titulo" required>
          </p>
          <p>
            <label>Autor:</label>
            <input type="text" [(ngModel)]="newLibro.autor" name="add_autor" required>
          </p>
          <p>
            <label>Género:</label>
            <input type="text" [(ngModel)]="newLibro.genero" name="add_genero" required>
          </p>
          <p>
            <label>Publicación (Año):</label>
            <input type="number" [(ngModel)]="newLibro.publicacion" name="add_publicacion" required>
          </p>

          <button type="submit" [disabled]="addLibroForm.invalid">
            Cargar nuevo libro 
          </button>
        </form>
      </td>
    </tr>
  </tfoot>
</table>

<ng-template #editModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Editar Libro </h4>
    <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  
  <div class="modal-body">
    
    <form #editLibroForm="ngForm">
      <p><label>Título:</label><input type="text" [(ngModel)]="newLibro.titulo" name="edit_titulo" required></p>
      <p><label>Autor:</label><input type="text" [(ngModel)]="newLibro.autor" name="edit_autor" required></p>
      <p><label>Género:</label><input type="text" [(ngModel)]="newLibro.genero" name="edit_genero" required></p>
      <p><label>Publicación (Año):</label><input type="number" [(ngModel)]="newLibro.publicacion" name="edit_publicacion" required></p>
    </form>
    
  </div>
  
  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="editLibroForm.invalid">
      Actualizar libro 
    </button>
  </div>
</ng-template>
